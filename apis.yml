aid: coinshift
name: Coinshift
description: >-
  Coinshift is a non-custodial, multi-chain onchain treasury management platform for startups, DAOs and
  crypto-native organisations, founded in 2021 as MultiSafe and built on top of Safe (Gnosis Safe) multisig
  accounts. The application unifies portfolio tracking across ERC-20 tokens and NFTs, multi-signature proposal
  and transaction workflows, mass and recurring payouts, contact and label management, CSV transaction export
  and cash-flow reporting, plus embedded dApp integrations for Aave, CoW Swap, 1inch, LI.FI, ParaSwap, Hedgey,
  Request Finance and Superfluid money streams, with Slack and Discord signing notifications. Coinshift also
  issues onchain yield assets — csUSDL, an ERC-4626 vault receipt token for USDL deposited into the Coinshift
  USDL Morpho Vault, csUSDC, the SHIFT governance token, and the iUSPC institutional credit product. Coinshift
  publishes no public developer API: the documentation at docs.coinshift.xyz is entirely end-user product and
  asset guidance, with no developer portal, API reference, OpenAPI, GraphQL schema or webhook catalog.
